---
# Copyright The Linux Foundation and each contributor to LFX.
# SPDX-License-Identifier: MIT
name: License Header Check

"on":
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: write

jobs:
  license-header-check:
    name: License Header Check
    # yamllint disable-line rule:line-length
    uses: linuxfoundation/lfx-public-workflows/.github/workflows/license-header-check.yml@737873e045a02df2f66b09d8061b98997cdf1880 # v0.2.0
    with:
      copyright_line: "Copyright The Linux Foundation and each contributor to LFX."
      # exclude_pattern entries are regex-escaped and matched as whole path components: (^|/)<value>(/.*|$). Do not add glob suffixes such as /* or /**.
      exclude_pattern: "gen,cmd/meeting-api/kodata"
